    common_deviations: [technical_violation_focus, checkbox_supervision, risk_score_overreliance, service_gap]
    stabilizers: [graduated_sanctions, judicial_review, service_referral, data_review]

  forensic_labs_medical_examiners:
    official_function: [produce_scientific_evidence, identify_causes, analyze_samples]
