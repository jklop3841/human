    high_permissions: [emergency_coordination, evacuation_recommendations_or_orders_where_lawful, resource_prioritization]
    dirty_reality_forces: [rare_event_complacency, political_visibility, interagency_fragmentation, uncertainty, media_pressure]
    common_deviations: [plan_without_drill, command_confusion, resource_hoarding, last_event_bias, emergency_power_persistence]
    stabilizers: [exercises, incident_command, mutual_aid, public_warning_protocols, after_action_review]

  coast_guard_search_and_rescue:
    official_function: [maritime_safety, rescue, navigation_security, border_or_law_enforcement_where_mandated]
    high_permissions: [rescue_command, vessel_inspection, maritime_enforcement]
    dirty_reality_forces: [weather, distance, asset_scarcity, competing_missions, time_pressure]
    common_deviations: [mission_tradeoff, asset_concentration, readiness_gap, paperwork_vs_patrol]
    stabilizers: [readiness_standards, joint_coordination, incident_review, clear_mission_priority]
