schema_version: "1.0"
book_id: HUMAN-BOOK-003
category: justice_security_emergency
framework: ../INSTITUTIONAL_DRIFT_FRAMEWORK.md

institutions:
  police_law_enforcement:
    official_function: [prevent_crime, respond_to_incidents, investigate, maintain_public_order, protect_life_and_property]
    high_permissions: [stop_search_where_lawful, arrest, use_of_force_under_law, investigation, evidence_collection]
    dirty_reality_forces: [call_volume, danger, uncertainty, response_time, clearance_metrics, arrest_or_activity_metrics, political_pressure, occupational_culture]
    common_deviations: [metric_chasing, easy_case_priority, overenforcement, underenforcement, confirmation_bias, paperwork_over_field_quality, informal_norms_over_policy]
    stabilizers: [warrants_where_required, courts, body_camera_or_records, internal_affairs, civilian_oversight, evidence_rules, complaint_process]

  prosecutors_public_prosecution:
    official_function: [assess_evidence, charge_cases, pursue_justice, represent_public_interest]
    high_permissions: [charging, plea_bargaining, case_dismissal, sentencing_recommendation]
    dirty_reality_forces: [caseload, conviction_metrics, political_visibility, bargaining_power, limited_trial_capacity]
    common_deviations: [conviction_rate_substitution_for_justice, overcharging_to_bargain, plea_dependence, weak_case_screening_or_excessive_screening, tunnel_vision]
    stabilizers: [disclosure_duties, judicial_review, defense_counsel, ethics_rules, conviction_integrity_review, supervisory_review]

  courts_judiciary:
    official_function: [adjudicate_disputes, interpret_law, determine_facts_or_review_fact_finding, protect_rights]
    high_permissions: [binding_orders, sentencing_where_applicable, injunctions, review_of_state_action]
    dirty_reality_forces: [case_backlog, precedent, docket_pressure, professional_norms, incomplete_records, unequal_legal_resources]
    common_deviations: [delay_as_denial, procedural_formalism, status_bias, precedent_lockin, plea_or_settlement_pressure, unequal_access]
    stabilizers: [appeal, open_reasons, recusal, independent_judiciary, adversarial_or_inquisitorial_checks, legal_aid]

  defense_bar_public_defenders_legal_aid:
    official_function: [represent_accused_or_disadvantaged_parties, protect_due_process]
    high_permissions: [legal_strategy, confidential_advice, negotiation, litigation]
    dirty_reality_forces: [extreme_caseload, funding_gap, time_pressure, client_information_gap]
    common_deviations: [minimal_contact, plea_default, triage_by_case_strength, burnout, template_defense]
    stabilizers: [caseload_limits, funding, supervision, ethics, independent_bar, appeal]

  corrections_prisons_detention:
    official_function: [secure_custody, lawful_punishment, rehabilitation, safety]
    high_permissions: [confinement, internal_rules, discipline, movement_control]
    dirty_reality_forces: [overcrowding, staff_safety, contraband, staffing_shortage, punitive_culture, low_public_visibility]
    common_deviations: [control_over_rehabilitation, informal_force_norms, dehumanization, grievance_suppression, warehousing]
    stabilizers: [courts, inspections, grievance_process, health_standards, external_monitoring, transparent_incident_reporting]

  probation_parole:
    official_function: [supervise_reentry, reduce_reoffending, enforce_conditions]
    high_permissions: [report_violations, recommend_revocation, impose_or_monitor_conditions_where_lawful]
