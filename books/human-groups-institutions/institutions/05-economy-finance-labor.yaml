schema_version: "1.0"
book_id: HUMAN-BOOK-003
category: economy_finance_labor
framework: ../INSTITUTIONAL_DRIFT_FRAMEWORK.md

institutions:
  central_bank:
    official_function: [monetary_stability, financial_stability, payment_system_support, lender_of_last_resort_where_mandated]
