analysis_rules:
  - "Do not infer corruption from poor outcomes alone."
  - "Separate resource scarcity, metric distortion, information failure, legitimate discretion, capture, and criminal corruption."
  - "Do not infer the belief of every employee from the behavior of the institution."
  - "Do not infer the institution's actual behavior from its mission statement alone."
  - "Do not treat performance metrics as equivalent to mission success."
  - "Always identify who experiences the institution as a client, subject, member, employee, regulator, or outsider."
  - "For high-permission institutions, map appeal, exit, dissent, audit, and correction channels."
