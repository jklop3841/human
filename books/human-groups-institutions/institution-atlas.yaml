framework: INSTITUTIONAL_DRIFT_FRAMEWORK.md
note: "This atlas is a comprehensive first-pass taxonomy of major modern human institutions, not a claim that every jurisdiction uses the same institutional forms. High-permission is an analytic label for real-world leverage, not a claim of illegitimacy."

core_model: "mission + permission + scarcity + metrics + hierarchy + discretion + information_asymmetry + self_preservation + external_interests + path_dependence + group_norms -> actual_institutional_behavior"

