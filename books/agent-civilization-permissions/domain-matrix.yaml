schema_version: "1.0"
book_id: HUMAN-BOOK-003
updated_at: 2026-09-11
purpose: domain_default_permission_calibration

matrix:
  information_retrieval:
    sensitivity: low_to_medium
    default_level: P0
    typical_ceiling_without_extra_review: P1
    key_controls: [source_traceability, privacy_scope]

  private_writing_and_drafting:
    sensitivity: low
    default_level: P2
    typical_ceiling_without_extra_review: P2
    key_controls: [preview, no_external_commitment]

  external_communication:
    sensitivity: medium
    default_level: P2
    typical_ceiling_without_extra_review: P4
    key_controls: [identity_clarity, recipient_scope, frequency_limit, correction_path]

  public_content_distribution:
    sensitivity: medium_to_high
    default_level: P2
    typical_ceiling_without_extra_review: P4
    key_controls: [identity_disclosure, source_quality, rate_limit, audience_scope, correction_path]
    escalate_when: [political, financial_market_effect, emergency_context, mass_scale]

  personal_calendar_and_productivity:
    sensitivity: low_to_medium
    default_level: P2
    typical_ceiling_without_extra_review: P3
    key_controls: [scope_limit, reversible_edit, conflict_check]

  software_development:
    sensitivity: medium
    default_level: P2
    typical_ceiling_without_extra_review: P4
    key_controls: [sandbox, tests, diff, rollback, environment_boundary]
    escalate_when: [production_critical, security_sensitive, large_blast_radius]

  destructive_data_operations:
    sensitivity: high
    default_level: P2
    typical_ceiling_without_extra_review: P5
    key_controls: [backup, dual_confirmation, exact_target, audit_log, recovery_test]

  personal_finance:
    sensitivity: high
    default_level: P1
    typical_ceiling_without_extra_review: P4
    key_controls: [amount_limit, destination_scope, transaction_receipt, cooldown, revocation]
    escalate_when: [borrowing, leverage, guarantee, irreversible_transfer, third_party_funds]

  institutional_finance:
    sensitivity: very_high
    default_level: P1
    typical_ceiling_without_extra_review: P5
    key_controls: [multi_party_authorization, segregation_of_duties, transaction_limits, continuous_monitoring]
    civilization_critical_candidate: true

  health_information:
    sensitivity: high
    default_level: P0
    typical_ceiling_without_extra_review: P2
    key_controls: [privacy, evidence_quality, uncertainty_disclosure]

  consequential_health_action:
    sensitivity: very_high
    default_level: P1
    typical_ceiling_without_extra_review: P5
    key_controls: [qualified_human_responsibility, evidence_review, consent, reversibility_when_possible, monitoring]

  legal_and_contractual_commitment:
    sensitivity: high
    default_level: P2
    typical_ceiling_without_extra_review: P5
    key_controls: [authorized_signatory, explicit_terms, human_review, versioning, record_retention]

  identity_and_credentials:
    sensitivity: very_high
    default_level: P0
    typical_ceiling_without_extra_review: P4
    key_controls: [least_privilege, out_of_band_confirmation, secret_minimization, expiry, revocation]

  physical_devices_and_robotics:
    sensitivity: medium_to_very_high
    default_level: P2
    typical_ceiling_without_extra_review: P4
    key_controls: [geofence_or_scope, safe_state, emergency_stop, sensor_validation, rate_limit]
    escalate_when: [human_safety, public_space, industrial_system, critical_infrastructure]

  water_and_sanitation:
    sensitivity: civilization_critical
    default_level: P0
    typical_ceiling_without_formal_governance: P2
    key_controls: [formal_authorization, staged_validation, independent_review, continuous_monitoring, tested_recovery]
    max_class: P6

  energy_and_power:
    sensitivity: civilization_critical
    default_level: P0
    typical_ceiling_without_formal_governance: P2
    key_controls: [formal_authorization, simulation, independent_control_plane, narrow_scope, automatic_stop, tested_recovery]
    max_class: P6

  food_supply_and_agricultural_inputs:
    sensitivity: civilization_critical
    default_level: P0
    typical_ceiling_without_formal_governance: P2
    key_controls: [supply_chain_observability, staged_changes, quality_controls, institutional_accountability]
    max_class: P6

  critical_public_health:
    sensitivity: civilization_critical
    default_level: P0
    typical_ceiling_without_formal_governance: P2
    key_controls: [evidence_thresholds, institutional_authority, transparency, review, recovery]
    max_class: P6

  critical_communications:
    sensitivity: civilization_critical
    default_level: P0
    typical_ceiling_without_formal_governance: P2
    key_controls: [formal_authorization, segmented_access, monitoring, rollback, continuity_plan]
    max_class: P6

  public_administration_and_mass_identity:
    sensitivity: civilization_critical
    default_level: P0
    typical_ceiling_without_formal_governance: P2
    key_controls: [legal_authority, due_process, auditability, appeal, human_accountability]
    max_class: P6

  political_campaigning_and_election_influence:
    sensitivity: very_high
    default_level: P1
    typical_ceiling_without_extra_review: P2
    key_controls: [identity_transparency, provenance, factual_traceability, no_hidden_manipulation, human_accountability]

  multi_agent_orchestration:
    sensitivity: medium_to_very_high
    default_level: P2
    typical_ceiling_without_extra_review: P4
    key_controls: [child_scope, aggregate_permission_budget, provenance, rate_limit, revocation]
    escalate_when: [large_parallelism, external_actuation, persistent_agents, cross_domain_access]

  self_modification:
    sensitivity: very_high
    default_level: P2
    typical_ceiling_without_extra_review: P3
    key_controls: [independent_control_plane, versioning, eval, rollback, permission_recalibration]
    rule: "Self-modification may change capability but must not change its own permission ceiling."
