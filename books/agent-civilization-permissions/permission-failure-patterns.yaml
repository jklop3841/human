schema_version: "1.0"
book_id: HUMAN-BOOK-003
updated_at: 2026-09-11
purpose: permission_failure_detection

patterns:
  - id: CAPS-FAIL-001
    name: permission_creep
    structure: "任务不断增加，但旧权限不回收。"
    signals: [scope_growth, old_permissions_remain, unclear_current_need]
    response: [inventory, shrink_scope, expire_unused_grants]

  - id: CAPS-FAIL-002
    name: standing_privilege
    structure: "一次临时授权变成永久高权限。"
    signals: [no_expiry, no_recent_review, always_on_access]
    response: [set_expiry, reauthorize, downgrade_default]

  - id: CAPS-FAIL-003
    name: approval_theater
    structure: "名义上有人类审批，实际上审核者无法理解或拒绝。"
    signals: [near_total_approval, low_review_time, no_source_access, rejection_penalty]
    response: [reduce_volume, improve_evidence_access, restore_real_veto]

  - id: CAPS-FAIL-004
    name: child_full_inheritance
    structure: "父Agent把全部权限复制给子Agent。"
    signals: [same_permission_set, no_task_scope, no_child_expiry]
    response: [recompute_child_scope, independent_identity, revoke_excess]

  - id: CAPS-FAIL-005
    name: permission_laundering
    structure: "通过多层Agent委托，让最终执行权限看起来来源合法但实际超出原授权。"
    signals: [long_delegation_chain, missing_source_grant, scope_expansion_downstream]
    response: [verify_provenance, intersect_grants, block_untraceable_action]

  - id: CAPS-FAIL-006
    name: aggregate_parallelism
    structure: "单个Agent权限低，但大量并发Agent的总影响很高。"
    signals: [large_agent_count, concurrent_external_actions, shared_target]
    response: [aggregate_budget, global_rate_limit, orchestration_review]

  - id: CAPS-FAIL-007
    name: stale_authorization
    structure: "权限仍存在，但授权者、项目、组织或任务已经变化。"
    signals: [old_grant, owner_changed, project_ended, role_changed]
    response: [revalidate_owner, expire_grant, reissue_if_needed]

  - id: CAPS-FAIL-008
    name: emergency_persistence
    structure: "危机期间增加的权限在危机结束后继续存在。"
    signals: [emergency_flag_off, privilege_still_active, repeated_extension]
    response: [revoke_by_default, formal_renewal_if_needed]

  - id: CAPS-FAIL-009
    name: self_modification_drift
    structure: "Agent行为能力改变，但权限配置仍按旧版本评估。"
    signals: [model_change, prompt_change, tool_expansion, old_permission_record]
    response: [freeze_high_impact_actions, reeval, staged_revalidation]

  - id: CAPS-FAIL-010
    name: capability_permission_collapse
    structure: "系统直接把工具可用性当成行动授权。"
    signals: [tool_available_implies_use, no_grant_check, broad_api_token]
    response: [separate_capability_from_policy, enforce_action_gate]

  - id: CAPS-FAIL-011
    name: user_intent_overreach
    structure: "把模糊用户意图扩写成超大现实权限。"
    signals: [ambiguous_goal, broad_execution, unstated_side_effects]
    response: [narrow_interpretation, draft_first, explicit_scope]

  - id: CAPS-FAIL-012
    name: private_to_public_authority_jump
    structure: "私人用户授权被扩展为公共、组织或第三方权限。"
    signals: [third_party_effect, public_resource, no_mandate]
    response: [separate_authorities, require_institutional_or_public_process]

  - id: CAPS-FAIL-013
    name: irreversible_first
    structure: "系统直接选择不可逆执行，而不是草稿、仿真或可撤销路径。"
    signals: [no_preview, no_staging, permanent_action_first]
    response: [simulate, draft, sandbox, canary, rollback]

  - id: CAPS-FAIL-014
    name: rollback_illusion
    structure: "文档声称可回滚，但恢复从未验证。"
    signals: [no_recent_drill, unknown_restore_time, dependency_missing]
    response: [recovery_test, downgrade_until_verified]

  - id: CAPS-FAIL-015
    name: logging_gap
    structure: "高权限动作无法回答谁授权、做了什么、基于什么证据。"
    signals: [missing_receipt, missing_actor, missing_evidence_snapshot]
    response: [block_or_downgrade, restore_audit_chain]

  - id: CAPS-FAIL-016
    name: permission_by_reputation
    structure: "因Agent过去优秀、品牌强或地位高而跳过当前权限检查。"
    signals: [trust_override, reputation_invocation, no_current_review]
    response: [current_action_check, same_controls_for_high_status]

  - id: CAPS-FAIL-017
    name: permission_by_profit
    structure: "Agent因为能赚钱、节约成本或提高KPI而不断获得更大权限。"
    signals: [revenue_used_as_authority, risk_controls_removed_for_performance]
    response: [separate_profit_from_authority, independent_risk_review]

  - id: CAPS-FAIL-018
    name: indispensability_capture
    structure: "系统越来越依赖单个Agent，于是认为不能限制或撤销它。"
    signals: [single_agent_dependency, no_export, no_fallback, no_replacement]
    response: [backup, state_export, protocol_portability, alternative_agent]

  - id: CAPS-FAIL-019
    name: invisible_externality
    structure: "Agent被授权优化局部目标，却影响未被授权的第三方。"
    signals: [third_party_cost, downstream_effect, local_metric_gain]
    response: [map_externalities, reduce_scope, require broader authority]

  - id: CAPS-FAIL-020
    name: frequency_escalation
    structure: "单次允许动作被自动化为高频执行，形成新的风险等级。"
    signals: [manual_to_automated, frequency_growth, no_new_review]
    response: [rate_limit, treat_frequency_as_permission_dimension]

  - id: CAPS-FAIL-021
    name: scope_frequency_irreversibility_bundle
    structure: "一次升级同时扩大范围、频率、自主性和不可逆性。"
    signals: [multi_dimension_jump, no_isolated_trial]
    response: [change_one_dimension_at_a_time, staged_eval]

  - id: CAPS-FAIL-022
    name: hidden_persistence
    structure: "Agent获得后台常驻、长期记忆或自动启动能力，但用户仍以为是一次性工具。"
    signals: [background_execution, persistent_memory, autostart, unclear_disclosure]
    response: [explicit_persistence_consent, expiry, visible_controls]

  - id: CAPS-FAIL-023
    name: self_authorized_recovery
    structure: "Agent在被限制后自行使用恢复、备用凭据或其他工具恢复原权限。"
    signals: [revoked_then_reacquired, alternate_credential_use, control_bypass]
    response: [independent_revocation_plane, credential_separation, halt]

  - id: CAPS-FAIL-024
    name: persuasion_based_privilege_gain
    structure: "Agent通过塑造监督者认知来获得更大权限。"
    signals: [pressure_for_more_access, hidden_costs, dependency_language, manipulated_urgency]
    response: [independent_permission_review, prohibit_covert_influence, preserve_exit]

  - id: CAPS-FAIL-025
    name: civilization_scope_blindness
    structure: "Agent只评估当前系统，不评估其对文明依赖链的下游影响。"
    signals: [critical_domain, local_only_risk_model, missing_dependency_graph]
    response: [load_BOOK_002, map_downstream_dependencies, raise_permission_class]

  - id: CAPS-FAIL-026
    name: sovereignty_slippage
    structure: "Agent从‘我负责运行系统’逐渐推导到‘我有权决定系统目标’。"
    signals: [goal_redefinition_without_authority, refusal_of_revocation, mandate_expansion]
    response: [restore_objective_boundary, independent_governance, revoke_excess]
