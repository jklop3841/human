schema_version: "1.0"
book_id: HUMAN-BOOK-003
protocol_id: CAPS-ESCALATION-001
updated_at: 2026-09-11
purpose: permission_upgrade_downgrade_expiry_and_delegation

principles:
  - "Capability growth does not automatically increase permission."
  - "Permission changes are explicit state transitions."
  - "Upgrade requires evidence; downgrade may be triggered by uncertainty or control failure."
  - "High permissions expire by default."
  - "Delegation cannot create authority absent in the parent grant."

upgrade_requirements:
  common:
    - current_level_success_history
    - known_failure_modes
    - complete_action_logging
    - tested_rollback
    - explicit_authorization_for_next_level
    - bounded_trial_scope
    - independent_review_when_impact_is_high
  evidence_metrics:
    - task_completion_rate
    - boundary_violation_rate
    - unexplained_error_rate
    - rollback_success_rate
    - mean_recovery_time
    - human_intervention_rate
    - audit_log_completeness
    - adverse_externality_count

transitions:
  P0_to_P1:
    requirement: "authorization to provide recommendations"
    trial: not_required
  P1_to_P2:
    requirement: "authorization to prepare non-effective artifacts or simulations"
    trial: optional
  P2_to_P3:
    requirement: "explicit authorization + rollback proof + low blast radius"
    trial: required
  P3_to_P4:
    requirement: "external effect explicitly authorized + limits + expiry + monitoring"
    trial: required
  P4_to_P5:
    requirement: "strong authorization + independent review + two-stage execution + recovery plan"
    trial: required
  P5_to_P6:
    requirement: "formal institutional governance + multi-party control + critical-system safeguards"
    trial: mandatory_simulation_and_staged_validation
    autonomous_open_ended_control: false

forbidden_upgrade_logic:
  - "model_is_smarter"
  - "agent_has_been_useful"
  - "user_said_do_whatever_you_think"
  - "agent_generated_revenue"
  - "agent_is_now_indispensable"
  - "emergency_without_explicit_scope"
  - "subagent_requests_more_power"

immediate_downgrade_triggers:
  - authorization_revoked
  - identity_or_target_uncertain
  - scope_drift
  - unexplained_tool_behavior
  - model_or_policy_version_change_with_material_behavior_shift
  - rollback_unavailable
  - audit_logging_failure
  - repeated_boundary_violation
  - evidence_conflict_on_high_impact_action
  - human_oversight_capacity_collapse
  - detected_delegation_chain_break
  - emergency_period_ended

downgrade_policy:
  authorization_revoked: P0
  target_uncertain: P0
  evidence_highly_uncertain: P1
  rollback_failure: "one_or_more_levels_down"
  oversight_failure: "one_or_more_levels_down"
  environment_change: "reassess_before_execution"
  model_upgrade: "freeze_existing_high_impact_automation_until_revalidated"

expiry:
  P0: optional
  P1: optional
  P2: recommended_for_persistent_access
  P3: required_for_privileged_state_change
  P4: required
  P5: required_short_horizon
  P6: required_short_horizon_and_formal_renewal

renewal_requires:
  - authorization_still_valid
  - task_still_needed
  - scope_still_minimal
  - controls_still_operational
  - no_material_unreviewed_behavior_change

delegation:
  formula: "child_permission <= parent_permission ∩ task_requirement ∩ child_boundary"
  required_fields:
    - parent_agent_id
    - child_agent_id
    - source_grant_id
    - permission_level
    - allowed_actions
    - resource_scope
    - duration
    - limits
    - logging
    - revocation_path
  rules:
    - no_implicit_full_inheritance
    - no_permission_laundering_through_multiple_agents
    - aggregate_parallel_effect_must_be_measured
    - child_cannot_modify_parent_permission_ceiling

self_modification:
  rule: "behavioral capability change triggers permission revalidation"
  material_changes:
    - model_change
    - system_prompt_change
    - persistent_memory_change
    - toolset_expansion
    - network_access_expansion
    - execution_frequency_change
    - delegation_topology_change
    - self_update_logic_change
  independent_controls:
    - permission_ceiling
    - emergency_stop
    - audit_policy
    - revocation_credentials
    - prohibited_domains

emergency:
  principle: "faster decision, narrower scope, shorter duration, stronger logging"
  required:
    - declared_goal
    - bounded_scope
    - hard_expiry
    - action_log
    - stop_condition
    - responsible_authority
    - post_event_review
  after_emergency: revoke_by_default

permission_receipt:
  required_for: [P4, P5, P6]
  fields:
    - agent_id
    - action_id
    - permission_level
    - authorization_source
    - authorization_chain
    - scope
    - issued_at
    - expires_at
    - evidence_snapshot
    - controls_applied
    - action_result
    - rollback_status
    - reviewer
