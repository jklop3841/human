self_corrections:
  - "从从零自建无敌多智能体系统，修正为优先复用成熟方案并做治理与适配。"
  - "从抽象架构即能力，修正为实现程度、可验证性、可交接性、可复用性必须同时检查。"
  - "从企业 AI 重交付，修正为重视毛利、边界、验收、预付款与负期望结构。"
  - "从自动化越多越好，修正为高信任/高客单场景需要人机共融。"
  - "从 AI 会自动纠错，修正为 AI 可能优化错误战场，人类必须负责意图、战场与价值判断。"
  - "从单条内容质量竞争，修正为作品级竞争与场级竞争并存。"
  - "从线性预测，修正为主导力线、干扰线、外部依赖、不可逆现实与冗余共同建模。"

