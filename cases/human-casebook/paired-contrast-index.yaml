candidate_variables:
  bad_news_safety:
    description: "Whether surfacing bad news, error or risk is institutionally safe."
  information_reachability:
    description: "Whether relevant information can reach the actor with real decision authority."
  proxy_distance:
    description: "Distance between measured proxy and actual mission outcome."
  frontline_correction_authority:
    description: "Whether frontline actors can pause, escalate or correct the process."
  independent_verification:
    description: "Whether claims and decisions are checked outside the originating chain."
  simulation_testability:
    description: "Whether high-risk actions can be tested or simulated before full execution."
  shared_objective_clarity:
    description: "How clearly distributed actors share the same top-level objective."
  responsibility_concentration:
    description: "Whether cross-boundary outcomes have a real owner rather than diffuse accountability."
  memory_retention:
    description: "Whether lessons from incidents persist in process, training and governance."
  correction_latency:
    description: "Time between error emergence, detection, acknowledgement and correction."

comparison_rule:
  required_fields: [shared_conditions, outcome_difference, candidate_difference_variables, competing_explanations, falsification_conditions, effect_on_human]
  warning: "Pair comparison identifies candidate variables; it does not by itself establish causal sufficiency or necessity."
