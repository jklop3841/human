    use_when:
      - "需要判断一个仓库、Skill、协议或Agent是否形成可验证的协议资产"
      - "需要审查创造者关系、版本谱系、调用计量、效果信誉和收入捕获"
      - "需要识别伪造调用量、自评冒充独立验证、离线漏计和分叉洗信誉"
