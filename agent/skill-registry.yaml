    related_method: "reasoning/HUMAN-METHOD-002.md"
    schema: "schemas/influence-audit.schema.json"
    use_when:
      - "需要审计消息、广告、社群、产品、政策或Agent中的谎言与操纵"
      - "需要使用七驱力指数和LIAR链识别身份、情绪与仪式锁定"
      - "需要把高风险影响材料转换为透明、可逆、可退出的替代方案"
