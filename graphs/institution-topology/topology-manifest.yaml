source_atlas:
  institution_count: 106
  domain_count: 8
  index: "books/human-groups-institutions/institution-atlas.yaml"
  directory: "books/human-groups-institutions/institutions/README.md"

files:
  readme: "graphs/institution-topology/README.md"
  nodes: "graphs/institution-topology/nodes.yaml"
  edges: "graphs/institution-topology/edges.yaml"
  agent_protocol: "agent/HUMAN_INSTITUTION_TOPOLOGY_LOAD.md"

coverage:
  registered_nodes: 106
  backbone_edges: 48
  node_coverage_ratio: 1.0
  edge_coverage_status: sparse_backbone_only
  jurisdiction_overlays: 0
  temporal_overlays: 0
  evidence_backed_edge_count: 11
  generic_archetype_edge_count: 27
  jurisdiction_dependent_edge_count: 7
