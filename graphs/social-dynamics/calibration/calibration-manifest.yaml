  - "strong_fit_means_structural_descriptive_fit_not_statistical_accuracy"
  - "every_calibration_must_preserve_model_misses_and_outside_model_factors"
  - "future_calibration_should_prioritize_disconfirming_and_mixed_cases"

next_build:
