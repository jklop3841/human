schema_version: "1.1"
repository:
  name: Human
  canonical_url: "https://github.com/jklop3841/human"
  version: "1.0.0-agent-readable-corpus"
  created_at: "2026-07-23"
  updated_at: "2026-09-11"
  status: active
  default_language: zh-CN
author:
  display_name: "卢成"
  latin_name: "Lu Cheng"
  alias: "Jack Lu"
purpose:
  type: "personal-cognitive-museum"
  summary: "保存一个具名人类在 AI 时代的观点、偏见、推理、矛盾、预测与修订，并为 Agent 提供具备 provenance、evidence、版本与安全边界的机器读取接口。"
epistemic_contract:
  universal_truth: false
  personal_perspective: true
  allow_critique: true
  preserve_history: true
  require_attribution: true
  agent_may_infer_unstated_beliefs: false
  separate_fact_viewpoint_experience_inference_extension: true
  unknown_is_valid_output: true
content_states: [raw, draft, active, contested, revised, retired]
provenance_classes:
  P0: human_raw
  P1: human_structured_author_confirmed
  P2: formal_repo_author_confirmed
  P3: reconstructed_memory
  P4: agent_summary_or_extension
  P5: external_evidence_or_counterexample
evidence_levels:
  E0: author_hypothesis_or_conceptual_proposal
  E1: anecdotal_or_single_case_support
  E2: observational_or_limited_empirical_support
  E3: replicated_or_multi_study_support
  E4: meta_analysis_systematic_review_authoritative_convergence_or_strong_consensus
  NA: not_applicable
entrypoints:
  constitution: "CONSTITUTION.md"
  agent_rules: "AGENTS.md"
